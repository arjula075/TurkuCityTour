name: Security

on:
  pull_request:
    branches: [First-release]
  push:
    branches: [First-release]
  workflow_dispatch:

concurrency:
  group: turkucitytour-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-anon-key
      VITE_THUNDERFOREST_API_KEY: ci-thunderforest-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run production dependency audit
        run: npm run security:audit

      - name: Run secret scan
        run: npm run security:scan-secrets

      - name: Run unit and component tests
        run: npm run security:test

      - name: Verify production security headers
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "DEPLOY_URL secret not set — skipping header verification"
            exit 0
          fi
          npm run security:verify-headers
